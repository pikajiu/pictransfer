<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清晰成册 · AI 照片增强</title></head>
<body>
<main>
  <header><span class="brand">◈ 清晰成册</span><h1>让照片更清晰</h1><p>用你已有的 AI 修图，把选好的结果整理成一份 PDF。</p></header>
  <section class="controls" aria-label="添加照片">
    <label class="picker" for="photos"><strong>＋ 选择照片</strong><span>JPG / PNG · 最多 5 张 · 每张 2 MB</span></label>
    <input id="photos" type="file" accept="image/jpeg,image/png" multiple>
    <p class="notice">在豆包、ChatGPT 或当前 Codex 对话里上传原图并修图。保存结果后，回到对应照片下点「导入修图结果」。</p>
    <div class="actions">
      <a href="https://www.doubao.com/chat/" target="_blank" rel="noopener noreferrer">打开豆包 ↗</a>
      <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">打开 ChatGPT ↗</a>
      <button id="copy-prompt" class="secondary">复制修图指令</button>
    </div>
    <details>
      <summary>查看修图指令</summary>
      <p id="prompt-text">请直接编辑我上传的原图并输出修好的图片。轻度去模糊、去噪和提高清晰度，尽量保留人物身份、五官、文字、原有色彩和构图。不要美颜、重绘背景或补写看不清的文字。无法可靠恢复的细节保持原样。</p>
    </details>
    <div class="actions"><button id="enhance" class="secondary" disabled>本机 2× 放大</button></div>
    <p class="notice">本机放大不上传照片。长边超过 1024 像素时先缩小再放大。</p>
    <p id="status" role="status"></p>
  </section>
  <section id="results" hidden><div class="section-head"><h2>照片与页序</h2><button id="export" disabled>下载 PDF</button></div><ol id="items"></ol></section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
